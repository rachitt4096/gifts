<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Love ❤️</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: linear-gradient(to bottom, #7fd3ff, #cfefff, #ffe4ec);
}
canvas {
  display: block;
  margin: auto;
}

#backBtn {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 20;
  background: rgba(0,0,0,0.4);
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 13px;
}

</style>
</head>

<body>

    <button id="backBtn">⬅ Back</button>


<canvas id="canvas" width="320" height="480"></canvas>

<script>
/* ===== CANVAS ===== */
const scrn = document.getElementById("canvas");
const sctx = scrn.getContext("2d");

/* ===== GAME STATE ===== */
let frames = 0;
const state = { curr: 0, getReady: 0, Play: 1, gameOver: 2 };
const dx = 2;

/* ===== BIRD ===== */
const birdImg = new Image();
birdImg.src = "Untitled.webp";

const bird = {
  x: 60,
  y: 150,
  r: 18,          // 🔥 collision radius (visual size)
  w: 46,
  h: 46,
  speed: 0,
  gravity: 0.125,
  thrust: 3.6,
  rotation: 0,

  draw() {
    sctx.save();
    sctx.translate(this.x, this.y);
    sctx.rotate(this.rotation * Math.PI / 180);
    sctx.drawImage(birdImg, -this.w/2, -this.h/2, this.w, this.h);
    sctx.restore();
  },

  update() {
    if (state.curr === state.getReady) {
      this.y += frames % 12 === 0 ? Math.sin(frames * 0.4) : 0;
      this.rotation = 0;
      return;
    }

    if (state.curr === state.Play) {
      this.speed += this.gravity;
      this.y += this.speed;
      this.rotation = Math.min(90, this.speed * 14);

      if (this.y - this.r <= 0) state.curr = state.gameOver;
      if (this.y + this.r >= scrn.height) state.curr = state.gameOver;
    }
  },

  flap() {
    this.speed = -this.thrust;
    this.rotation = -25;
  }
};

/* ===== PIPES ===== */
const topPipe = new Image();
const botPipe = new Image();
topPipe.src = "bottle1.webp";
botPipe.src = "bottle2.webp";

const pipe = {
  width: 96,
  gap: 150,
  spacing: 90,
  pipes: [],

  draw() {
    this.pipes.forEach(p => {
      sctx.drawImage(topPipe, p.x, 0, this.width, p.topH);
      sctx.drawImage(botPipe, p.x, p.bottomY, this.width, p.bottomH);
    });
  },

  update() {
    if (state.curr !== state.Play) return;

    if (frames % this.spacing === 0) {
      const minTop = 60;
      const maxTop = scrn.height - this.gap - 160;
      const topH = Math.random() * (maxTop - minTop) + minTop;

      this.pipes.push({
        x: scrn.width,
        topH,
        bottomY: topH + this.gap,
        bottomH: scrn.height - (topH + this.gap)
      });
    }

    this.pipes.forEach(p => {
      p.x -= dx;

      // 🔥 TRUE TOUCH COLLISION (CIRCLE vs RECT)
      if (
        circleRectHit(
          bird.x,
          bird.y,
          bird.r,
          p.x,
          0,
          this.width,
          p.topH
        ) ||
        circleRectHit(
          bird.x,
          bird.y,
          bird.r,
          p.x,
          p.bottomY,
          this.width,
          p.bottomH
        )
      ) {
        state.curr = state.gameOver;
      }
    });

    if (this.pipes.length && this.pipes[0].x < -this.width) {
      this.pipes.shift();
      UI.score++;
    }
  }
};

/* ===== CIRCLE–RECT COLLISION ===== */
function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return dx * dx + dy * dy <= cr * cr;
}

/* ===== UI ===== */
const UI = {
  score: 0,

  draw() {
    sctx.fillStyle = "#fff";
    sctx.font = "bold 28px Arial";
    sctx.fillText(this.score, scrn.width / 2 - 8, 42);

    if (state.curr === state.gameOver) {
      sctx.fillStyle = "rgba(0,0,0,0.55)";
      sctx.fillRect(0, 0, scrn.width, scrn.height);

      sctx.fillStyle = "#fff";
      sctx.textAlign = "center";
      sctx.font = "26px Arial";

      sctx.fillText(
        this.score < 20 ? "Trip Cancel 😌" : "Trip Confirmed ❤️",
        scrn.width / 2,
        scrn.height / 2
      );

      sctx.font = "16px Arial";
      sctx.fillText("Tap to restart", scrn.width / 2, scrn.height / 2 + 40);
      sctx.textAlign = "left";
    }
  }
};

/* ===== INPUT ===== */
scrn.addEventListener("click", () => {
  if (state.curr === state.getReady) state.curr = state.Play;
  else if (state.curr === state.Play) bird.flap();
  else if (state.curr === state.gameOver) resetGame();
});

/* ===== RESET ===== */
function resetGame() {
  state.curr = state.getReady;
  pipe.pipes = [];
  bird.y = 150;
  bird.speed = 0;
  UI.score = 0;
}

/* ===== LOOP ===== */
function draw() {
  sctx.clearRect(0, 0, scrn.width, scrn.height);
  pipe.draw();
  bird.draw();
  UI.draw();
}

document.getElementById("backBtn").onclick = () => {
  window.location.href = "index.html";
};


function update() {
  bird.update();
  pipe.update();
}

setInterval(() => {
  update();
  draw();
  frames++;
}, 20);
</script>

</body>
</html>
