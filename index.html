<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  max-width: 100%;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  font-family: Poppins, Arial, sans-serif;
  background: linear-gradient(135deg,#ff1744,#ff5e80,#ff8fab,#ff5e80);
  background-size: 300% 300%;
  animation: gradientMove 16s ease infinite;
  color: white;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* FLOATING HEARTS */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 18px;
  animation: floatUp linear infinite;
  pointer-events: none;
}
@keyframes floatUp {
  to { transform: translateY(-120vh); opacity: 0; }
}

/* TOP BUTTONS */
#refreshBtn,
#testBtn {
  position: fixed;
  top: 12px;
  background: rgba(255,255,255,0.2);
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: 700;
  z-index: 10;
}

#refreshBtn { left: 12px; }
#testBtn { right: 12px; }

/* SAFE CONTAINER */
.safe {
  width: 100%;
  max-width: 420px;
  height: 100%;
  margin: 0 auto;
  padding: 60px 16px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

/* TITLE */
h1 {
  font-size: 24px;
  margin: 0;
  text-align: center;
  line-height: 1.2;
}

/* SCENE */
#scene {
  position: relative;
  width: 100%;
  max-width: 360px;
  height: 240px;
  overflow: hidden;
}

/* IMAGES */
#girl, #me, #us {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
}

#girl {
  width: 120px;
  left: 50%;
  transform: translate(-50%, -50%);
}

#me {
  width: 120px;
  left: 0%;
  transition: left 0.4s ease;
}

#us {
  width: 150px;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
}

/* BUTTONS */
.buttons {
  position: relative;
  width: 100%;
  max-width: 260px;
  display: flex;
  justify-content: space-between;
}

button {
  width: 80px;
  height: 28px;
  font-size: 11px;
  font-weight: 700;
  border: none;
  border-radius: 11px;
}

/* NO / YES */
#no {
  background: #ff5b5b;
  position: relative;
}

#yes {
  background: #2bc878;
}

/* YAY TEXT */
.yayy {
  position: fixed;
  top: 50%;
  font-size: 22px;
  font-weight: 800;
  animation: pop 0.6s ease forwards;
  z-index: 20;
}

.yayy.left { left: 8px; }
.yayy.right { right: 8px; }

@keyframes pop {
  from { opacity: 0; transform: scale(0.6); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<button id="refreshBtn">↻ Restart</button>
<button id="testBtn">A test for u</button>

<div class="safe">
  <h1>Sreeja Sen<br>Will you be my Valentine? 💕</h1>

  <div id="scene">
    <img id="girl" src="Untitled.webp">
    <img id="me" src="me1.webp">
    <img id="us">
  </div>

  <div class="buttons">
    <button id="no">No</button>
    <button id="yes">Yes</button>
  </div>
</div>

<script>
/* FLOATING HEARTS */
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = "❤️";
  h.style.left = Math.random() * 100 + "%";
  h.style.animationDuration = 6 + Math.random() * 4 + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 10000);
}, 600);

const girl = document.getElementById("girl");
const me = document.getElementById("me");
const us = document.getElementById("us");
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const testBtn = document.getElementById("testBtn");
const refreshBtn = document.getElementById("refreshBtn");

const mePhotos = ["me2.webp", "me3.webp"];
const usPhotos = ["us1.webp", "us2.png"];

let meIndex = 0;
let usIndex = 0;
let noClicks = 0;
let mePos = 0;

/* RESTART */
refreshBtn.onclick = () => location.reload();

/* NO CLICK (bounded movement) */
noBtn.onclick = () => {
  noClicks++;

  const btnArea = document.querySelector(".buttons");
  const areaRect = btnArea.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  // Max movement inside buttons area
  const maxX = areaRect.width - btnRect.width;
  const maxY = 40; // vertical chaos 😈

  const randomX = Math.random() * maxX - maxX / 2;
  const randomY = Math.random() * maxY - maxY / 2;

  noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;

  if (noClicks < 5) {
    me.src = mePhotos[meIndex];
    meIndex = (meIndex + 1) % mePhotos.length;
    mePos = Math.min(mePos + 8, 42);
    me.style.left = mePos + "%";
    return;
  }

  girl.style.display = "none";
  me.style.display = "none";
  us.style.display = "block";
  us.src = usPhotos[usIndex];
  usIndex = (usIndex + 1) % usPhotos.length;
};
;

/* YES CLICK */
yesBtn.onclick = () => {
  us.style.display = "block";
  us.src = "us3.webp";

  ["left","right"].forEach(side => {
    const d = document.createElement("div");
    d.className = "yayy " + side;
    d.textContent = "YAYY!!!! 🎉";
    document.body.appendChild(d);
  });
};

/* TRY ME → OPEN GAME */
testBtn.onclick = () => {
  window.location.href = "game.html";
};
</script>

</body>
</html>
